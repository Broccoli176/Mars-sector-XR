<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marte VR Survival</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #dev-help {
        position: fixed; left: 12px; top: 12px; max-width: 420px; padding: 10px 12px;
        background: rgba(10, 14, 18, 0.8); color: #d8e1e8; font-size: 13px; line-height: 1.4;
        border: 1px solid #3a4652; border-radius: 6px; pointer-events: none;
      }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%; background: #ffcf66; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="dev-help"></div>
    <div id="crosshair"></div>
    <script type="module" src="/src/core/main.js"></script>
  </body>
</html>
