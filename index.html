<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ares Uno · Marte VR Survival</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
      #app { position: fixed; inset: 0; }
      #onboarding-panel {
        position: fixed; left: 14px; top: 14px; max-width: 440px; padding: 12px 14px;
        background: rgba(14, 19, 26, 0.88); color: #d8e1e8; font-size: 13px; line-height: 1.45;
        border: 1px solid #3a4b5b; border-radius: 8px; backdrop-filter: blur(6px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); z-index: 10;
      }
      #onboarding-header {
        display: flex; align-items: center; justify-content: space-between;
        font-weight: 600; color: #ffcf66; margin-bottom: 6px; font-size: 14px;
      }
      #onboarding-toggle {
        background: #243140; color: #a4b3c4; border: 1px solid #3d4f62; border-radius: 4px;
        cursor: pointer; font-size: 11px; padding: 2px 7px; font-weight: normal;
      }
      #onboarding-toggle:hover { background: #324357; color: #ffffff; }
      #onboarding-content { white-space: pre-line; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
        border-radius: 50%; background: rgba(255, 207, 102, 0.7);
        border: 1px solid rgba(0, 0, 0, 0.4); pointer-events: none; z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="onboarding-panel">
      <div id="onboarding-header">
        <span>Ares Uno · Base Subterránea</span>
        <button id="onboarding-toggle" type="button" aria-label="Alternar ayuda">Minimizar</button>
      </div>
      <div id="onboarding-content"></div>
    </div>
    <div id="crosshair"></div>
    <script type="module" src="/src/core/main.js"></script>
  </body>
</html>
